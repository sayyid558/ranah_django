services:
  db:
    image: mysql:8.0
    container_name: ranah_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ranah_db}
      MYSQL_USER: ${DB_USER:-ranah_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ranah_pass_123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass_123}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_ROOT_PASSWORD:-root_pass_123} --silent"]
      interval: 5s
      timeout: 5s
      retries: 15

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ranah_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_ENGINE: mysql
      DB_HOST: ranah_db
      DB_PORT: "3306"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
  caddy:
    image: caddy:2-alpine
    container_name: ranah_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  mysql_data:
  static_volume:
  media_volume:
  caddy_data:
  caddy_config:

